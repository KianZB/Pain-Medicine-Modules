<style>
/* Pain Fundamentals module integrated left sidebar */

body.pf-page #quarto-content {
  padding-left: 285px;
}

body.pf-page main.content,
body.pf-page #quarto-document-content {
  max-width: 950px !important;
  margin-right: auto !important;
}

#pf-section-nav {
  position: fixed;
  top: 64px;
  left: 0;
  bottom: 0;
  width: 255px;
  z-index: 900;
  background:
    radial-gradient(circle, rgba(122, 0, 60, 0.055) 1.2px, transparent 1.2px),
    linear-gradient(to bottom, #fbfafb, #f4f1f3);
  background-size: 26px 26px, auto;
  border-right: 1px solid rgba(122, 0, 60, 0.22);
  padding: 28px 22px;
  box-shadow: 4px 0 18px rgba(0, 0, 0, 0.05);
  font-size: 0.93rem;
  overflow-y: auto;
}

#pf-section-nav h3 {
  color: #7A003C;
  font-size: 1.02rem;
  margin: 0 0 18px 0;
  font-weight: 800;
}

#pf-section-nav a {
  display: block;
  color: #7A003C;
  text-decoration: none;
  font-weight: 500;
  padding: 8px 10px;
  border-radius: 7px;
  margin-bottom: 6px;
}

#pf-section-nav a:hover {
  background: rgba(122, 0, 60, 0.07);
}

#pf-section-nav a.active {
  background: #7A003C;
  color: #ffffff;
  font-weight: 700;
}

.pf-location {
  display: block;
  margin: -8px 0 16px;
  color: #6a5b63;
  font-size: 0.82rem;
  line-height: 1.35;
}

.pf-pagination {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 1.5rem;
}

#pf-mobile-nav {
  display: none;
}

@media (max-width: 1150px) {
  body.pf-page #quarto-content {
    padding-left: 0;
  }

  #pf-section-nav {
    display: none;
  }

  #pf-mobile-nav {
    display: block;
    margin: 0 0 1.5rem;
    border: 1px solid rgba(122, 0, 60, 0.22);
    border-radius: 8px;
    background: #fbfafb;
  }

  #pf-mobile-nav summary {
    cursor: pointer;
    padding: 12px 14px;
    color: #7A003C;
    font-weight: 700;
  }

  #pf-mobile-nav nav {
    padding: 0 8px 10px;
  }

  #pf-mobile-nav a {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    color: #7A003C;
    text-decoration: none;
  }

  #pf-mobile-nav a.active {
    background: #7A003C;
    color: #ffffff;
    font-weight: 700;
  }

  .pf-pagination {
    justify-content: center;
  }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const pages = [
    { title: "Introduction", href: "pain-fundamentals-introduction.html" },
    { title: "Terminology", href: "pain-fundamentals-terminology.html" },
    { title: "Pain Classification", href: "pain-fundamentals-classification.html" },
    { title: "Pain Pathways", href: "pain-fundamentals-pathways.html" },
    { title: "Sensitization", href: "pain-fundamentals-sensitization.html" },
    { title: "Pain Modulation", href: "pain-fundamentals-modulation.html" },
    { title: "Nerve Injury", href: "pain-fundamentals-nerve-injury.html" },
    { title: "Radiofrequency Ablation", href: "pain-fundamentals-rfa.html" },
    { title: "References", href: "pain-fundamentals-references.html" }
  ];

  const pageName = window.location.pathname.replace(/\/+$/, "").split("/").pop() || "index";
  const currentPage = pageName.endsWith(".html") ? pageName : `${pageName}.html`;
  const isPainFundamentalsPage = pages.some(page => page.href === currentPage);

  if (!isPainFundamentalsPage) return;

  document.body.classList.add("pf-page");

  const currentIndex = pages.findIndex(page => page.href === currentPage);
  const locationText = `${currentIndex + 1} of ${pages.length} — ${pages[currentIndex].title}`;

  const nav = document.createElement("aside");
  nav.id = "pf-section-nav";

  let html = `<h3>Table of Contents</h3><span class="pf-location">${locationText}</span>`;

  pages.forEach(page => {
    const activeClass = page.href === currentPage ? "active" : "";
    html += `<a class="${activeClass}" href="${page.href}">${page.title}</a>`;
  });

  nav.innerHTML = html;
  document.body.appendChild(nav);

  const mobileNav = document.createElement("details");
  mobileNav.id = "pf-mobile-nav";
  mobileNav.innerHTML = `<summary>${locationText}</summary><nav>${html.replace(/<h3>[\s\S]*?<\/h3><span class="pf-location">[\s\S]*?<\/span>/, "")}</nav>`;
  const documentContent = document.querySelector("#quarto-document-content");
  if (documentContent) documentContent.prepend(mobileNav);
});
</script>
