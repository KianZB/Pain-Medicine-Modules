<style>
/* Pain Fundamentals module integrated left sidebar */

body.pf-page #quarto-content {
  padding-left: 285px;
}

body.pf-page main.content,
body.pf-page #quarto-document-content {
  max-width: 950px !important;
  margin-right: auto !important;
}

#pf-section-nav {
  position: fixed;
  top: 64px;
  left: 0;
  bottom: 0;
  width: 255px;
  z-index: 900;
  background:
    radial-gradient(circle, rgba(122, 0, 60, 0.055) 1.2px, transparent 1.2px),
    linear-gradient(to bottom, #fbfafb, #f4f1f3);
  background-size: 26px 26px, auto;
  border-right: 1px solid rgba(122, 0, 60, 0.22);
  padding: 28px 22px;
  box-shadow: 4px 0 18px rgba(0, 0, 0, 0.05);
  font-size: 0.93rem;
  overflow-y: auto;
}

#pf-section-nav h3 {
  color: #7A003C;
  font-size: 1.02rem;
  margin: 0 0 18px 0;
  font-weight: 800;
}

#pf-section-nav a {
  display: block;
  color: #7A003C;
  text-decoration: none;
  font-weight: 500;
  padding: 8px 10px;
  border-radius: 7px;
  margin-bottom: 6px;
}

#pf-section-nav a:hover {
  background: rgba(122, 0, 60, 0.07);
}

#pf-section-nav a.active {
  background: #7A003C;
  color: #ffffff;
  font-weight: 700;
}

@media (max-width: 1150px) {
  body.pf-page #quarto-content {
    padding-left: 0;
  }

  #pf-section-nav {
    display: none;
  }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const pages = [
    { title: "Introduction", href: "pain-fundamentals-introduction.html" },
    { title: "Terminology", href: "pain-fundamentals-terminology.html" },
    { title: "Pain Classification", href: "pain-fundamentals-classification.html" },
    { title: "Pain Pathways", href: "pain-fundamentals-pathways.html" },
    { title: "Sensitization", href: "pain-fundamentals-sensitization.html" },
    { title: "Pain Modulation", href: "pain-fundamentals-modulation.html" },
    { title: "Nerve Injury", href: "pain-fundamentals-nerve-injury.html" },
    { title: "Radiofrequency Ablation", href: "pain-fundamentals-rfa.html" }
  ];

  const currentPage = window.location.pathname.split("/").pop() || "index.html";
  const isPainFundamentalsPage = pages.some(page => page.href === currentPage);

  if (!isPainFundamentalsPage) return;

  document.body.classList.add("pf-page");

  const nav = document.createElement("aside");
  nav.id = "pf-section-nav";

  let html = "<h3>Table of Contents</h3>";

  pages.forEach(page => {
    const activeClass = page.href === currentPage ? "active" : "";
    html += `<a class="${activeClass}" href="${page.href}">${page.title}</a>`;
  });

  nav.innerHTML = html;
  document.body.appendChild(nav);
});
</script>
