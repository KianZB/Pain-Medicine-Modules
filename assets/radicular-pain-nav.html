<style>
/* Radicular Pain module integrated left sidebar */

body.rp-page #quarto-content {
  padding-left: 285px;
}

body.rp-page main.content,
body.rp-page #quarto-document-content {
  max-width: 950px !important;
  margin-right: auto !important;
}

#rp-section-nav {
  position: fixed;
  top: 64px;
  left: 0;
  bottom: 0;
  width: 255px;
  z-index: 900;
  background:
    radial-gradient(circle, rgba(122, 0, 60, 0.055) 1.2px, transparent 1.2px),
    linear-gradient(to bottom, #fbfafb, #f4f1f3);
  background-size: 26px 26px, auto;
  border-right: 1px solid rgba(122, 0, 60, 0.22);
  padding: 28px 22px;
  box-shadow: 4px 0 18px rgba(0, 0, 0, 0.05);
  font-size: 0.93rem;
  overflow-y: auto;
}

#rp-section-nav h3 {
  color: #7A003C;
  font-size: 1.02rem;
  margin: 0 0 18px 0;
  font-weight: 800;
}

#rp-section-nav a {
  display: block;
  color: #7A003C;
  text-decoration: none;
  font-weight: 500;
  padding: 8px 10px;
  border-radius: 7px;
  margin-bottom: 6px;
}

#rp-section-nav a:hover {
  background: rgba(122, 0, 60, 0.07);
}

#rp-section-nav a.active {
  background: #7A003C;
  color: #ffffff;
  font-weight: 700;
}

@media (max-width: 1150px) {
  body.rp-page #quarto-content {
    padding-left: 0;
  }

  #rp-section-nav {
    display: none;
  }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const pages = [
    { title: "Introduction", href: "radicular-pain-introduction.html" },
    { title: "Relevant Anatomy", href: "radicular-pain-relevant-anatomy.html" },
    { title: "Clinical Presentation", href: "radicular-pain-clinical-presentation.html" },
    { title: "Investigations", href: "radicular-pain-investigations.html" },
    { title: "Management", href: "radicular-pain-management.html" },
    { title: "Summary", href: "radicular-pain-summary.html" },
    { title: "More Cases", href: "radicular-pain-more-cases.html" },
  ];

  const currentPage = window.location.pathname.split("/").pop() || "index.html";
  const isRadicularPainPage = pages.some(page => page.href === currentPage);

  if (!isRadicularPainPage) return;

  document.body.classList.add("rp-page");

  const nav = document.createElement("aside");
  nav.id = "rp-section-nav";

  let html = "<h3>Table of Contents</h3>";

  pages.forEach(page => {
    const activeClass = page.href === currentPage ? "active" : "";
    html += `<a class="${activeClass}" href="${page.href}">${page.title}</a>`;
  });

  nav.innerHTML = html;
  document.body.appendChild(nav);
});
</script>
