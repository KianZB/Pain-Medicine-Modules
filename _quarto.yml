format:
  html:
    theme: cosmo
    css:
      - assets/styles.css
      - assets/callout-preview.css
    description-meta: "Free educational modules in pain medicine, covering foundational concepts, clinical assessment, and management for medical learners."
    toc: false
    page-layout: full
    include-after-body:
      - assets/back-pain-nav.html
      - assets/pain-fundamentals-nav.html
      - assets/radicular-pain-nav.html
      - assets/discogenic-pain-nav.html
      - assets/spondylolisthesis-nav.html
      - assets/spasticity-nav.html
