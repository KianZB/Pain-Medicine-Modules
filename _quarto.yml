          - text: Back and Leg Pain
            href: clinical-challenge.html?id=shooting-pain-down-leg
          - text: Persistent Shoulder Pain
            href: clinical-challenge.html?id=shoulder-pain-overhead-activity
          - text: Hand Tingling
            href: clinical-challenge.html?id=numb-fingers-at-night
          - text: New Foot Weakness
            href: clinical-challenge.html?id=new-onset-foot-weakness
          - text: Clumsy Hands
            href: clinical-challenge.html?id=neck-pain-clumsy-hands
          - text: Persistent Back Pain
            href: clinical-challenge.html?id=back-pain-young-adult
          - text: Wrist Pain After Injury
            href: clinical-challenge.html?id=persistent-pain-after-fracture
